name: Build CV

on:
  push:
    branches: [main]
    paths: [index.md, build/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install fonts
        run: sudo apt-get install -y --no-install-recommends fonts-liberation
      - name: Build index.html and PDF
        run: ./build/build.sh
        env:
          CHROME: google-chrome
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Edward-Weston-CV.pdf
          git diff --cached --quiet || (git commit -m "Build CV html and pdf" && git push)
