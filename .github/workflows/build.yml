name: Build and deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install fonts
        run: sudo apt-get install -y --no-install-recommends fonts-liberation
      - name: Build index.html and PDF
        run: ./build/build.sh
        env:
          CHROME: google-chrome
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html Edward-Weston-CV.pdf _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # The image job needs the same files. Uploading them as an artifact keeps
      # the Docker build free of Node and Chrome, so it stays fast under QEMU.
      - name: Upload site for the image build
        uses: actions/upload-artifact@v4
        with:
          name: cv-site
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    needs: build
    permissions:
      # A called workflow can only narrow these; see homelab-deploy's publish.yml.
      contents: read
      packages: write
    uses: geekyed/homelab-deploy/.github/workflows/publish.yml@main
    with:
      image: ghcr.io/geekyed/edward-weston-cv
      artifact: cv-site
